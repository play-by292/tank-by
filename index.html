        #joystick-zone { position: absolute; bottom: 20px; left: 24px; width: 124px; height: 124px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(137,180,250,0.35); pointer-events: auto; }

        /* ==================== 3. 全屏弹窗系统 (修复NO.1遮挡问题) ==================== */

<body>

<script>
/**
 * ====================================================================
 * 1. 全局配置与 16 维超神基因定义
 * ====================================================================
 */
window.SERVER_CONFIG = window.SERVER_CONFIG || {
    adminPin: '8888',
    noticeText: '🔥 天梯榜首自动成为全服守关大BOSS！16维极限AI等你来破！',
    tankSpeed: 3.1,
    bulletSpeed: 4.4,
    maxBounces: 5,
    maxAmmo: 3,
    // 主节点：站长专属 npoint 云端接口
    cloudApiUrl: 'https://api.npoint.io/55fa615e9b8474d58c5c',
    // 国内免翻墙 CDN 加速代理通道（当玩家国内4G直连受阻时自动启用）
    proxyUrls: [
        'https://api.npoint.io/55fa615e9b8474d58c5c',
        'https://corsproxy.io/?' + encodeURIComponent('https://api.npoint.io/55fa615e9b8474d58c5c'),
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://api.npoint.io/55fa615e9b8474d58c5c')
    ]
};

const DNA_SPEC = [
    ['dodge',  '⚡闪避神经', 0.8, 5.0, 2],
    ['matrix', '🔮矩阵预演', 1,   12,  0],
    ['bncW',   '🛡️冷枪警惕', 0.8, 4.2, 2],
    ['iq',     '📐几何折射', 4,   18,  0],
    ['amb',    '🎯折线阴人', 0.0, 1.0, 2],
    ['lead',   '📏动态预判', 0.0, 1.4, 2],
    ['supp',   '🔥火力压制', 0.0, 1.0, 2],
    ['consv',  '🔋弹药精算', 0.0, 1.0, 2],
    ['rage',   '💢绝境狂暴', 1.0, 2.2, 2],
    ['peek',   '🧱掩体卡位', 0.2, 2.5, 2],
    ['feint',  '🌀假动作率', 0.0, 0.4, 2],
    ['wall',   '🚧防撞斥力', 0.5, 2.8, 2],
    ['cor',    '🧭死角逃逸', 0.5, 3.0, 2],
    ['dist',   '🤺交战距离', 75,  250, 0],
    ['freq',   '🐍蛇皮走位', 0.01,0.12,3],
    ['pat',    '⏳扣扳机欲', 0.4, 1.6, 2]
];

const DEFAULT_LADDER = [
    { id: 'top_1', aiName: '👑零式·矩阵神皇', author: '官方殿堂守关', gen: 5200, fit: 3680, dna: { dodge:3.85, matrix:10, bncW:3.60, iq:16, amb:0.94, lead:0.88, supp:0.75, consv:0.85, rage:1.65, peek:1.85, feint:0.25, wall:1.55, cor:2.10, dist:180, freq:0.055, pat:0.78 } },
    { id: 'top_2', aiName: '⚡九重折线死神', author: '几何学博士', gen: 2890, fit: 3120, dna: { dodge:3.10, matrix:8,  bncW:3.25, iq:18, amb:0.98, lead:0.72, supp:0.60, consv:0.70, rage:1.45, peek:2.10, feint:0.18, wall:1.40, cor:1.80, dist:215, freq:0.042, pat:0.85 } },
    { id: 'top_3', aiName: '🔥幻影压制狂魔', author: 'AlphaTank', gen: 1950, fit: 2790, dna: { dodge:4.20, matrix:9,  bncW:2.80, iq:12, amb:0.65, lead:1.05, supp:0.92, consv:0.40, rage:1.95, peek:1.20, feint:0.32, wall:1.30, cor:1.90, dist:120, freq:0.085, pat:0.55 } },
    { id: 'top_4', aiName: '🛡️不动明王V8',   author: '苟道流鼻祖', gen: 1120, fit: 2340, dna: { dodge:4.60, matrix:11, bncW:3.90, iq:10, amb:0.82, lead:0.60, supp:0.35, consv:0.95, rage:1.30, peek:2.20, feint:0.28, wall:1.80, cor:2.40, dist:230, freq:0.035, pat:1.10 } }
];

const SAVE_KEY = 'TANK_16D_SAVE_V2';
const LADDER_KEY = 'TANK_16D_LADDER_V2';
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

/**
 * ====================================================================
 * 2. 独立超时多线竞速云端引擎 (彻底修复国内4G被慢节点拖死的问题)
 * ====================================================================
 */
// 单个请求独立超时器，绝不互相拖累
async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
        const res = await fetch(url, { ...options, signal: ctrl.signal });
        clearTimeout(id);
        return res;
    } catch (e) {
        clearTimeout(id);
        throw e;
    }
}

const Cloud = {
    list: [],
    syncStatus: '🔄 正在连接全服云端...',

    init() {
        let merged = [...DEFAULT_LADDER];
        for (let key of [LADDER_KEY, 'TANK_CACHED_CLOUD_LIST']) {
            try {
                const arr = JSON.parse(localStorage.getItem(key));
                if (Array.isArray(arr)) merged.push(...arr);
            } catch(e) {}
        }
        this.mergeIntoList(merged);
        this.sortAndApplyTopBoss();
        this.syncCloud(false);
    },

    mergeIntoList(items) {
        const map = new Map();
        [...this.list, ...items].forEach(it => {
            if (it && it.aiName && it.dna) {
                it.dna = AI.fixDNA(it.dna);
                const key = `${it.aiName.replace(/^👑\s*/, '')}_${it.author}`;
                if (!map.has(key) || map.get(key).fit < it.fit) map.set(key, it);
            }
        });
        this.list = Array.from(map.values());
    },

    getTopBoss() {
        return this.list[0] || DEFAULT_LADDER[0];
    },

    sortAndApplyTopBoss() {
        this.list.sort((a, b) => b.fit - a.fit);
        if (this.list.length > 25) this.list = this.list.slice(0, 25);
        localStorage.setItem(LADDER_KEY, JSON.stringify(this.list));

        const top = this.getTopBoss();
        const d = AI.fixDNA(top.dna);
        document.getElementById('home-boss-name').innerText = top.aiName;
        document.getElementById('home-boss-author').innerText = `培育者: ${top.author} (G${top.gen})`;
        document.getElementById('home-boss-fit').innerText = `⚡战力: ${top.fit}`;

        document.getElementById('home-dna-grid').innerHTML = `
            <div class="dna-cell">⚡闪避: <b>${d.dodge}</b></div>
            <div class="dna-cell">🔮预演: <b>${d.matrix}帧</b></div>
            <div class="dna-cell">📐折射: <b>${d.iq}级</b></div>
            <div class="dna-cell">🎯阴人: <b>${Math.round(d.amb*100)}%</b></div>
            <div class="dna-cell">🔥压制: <b>${Math.round(d.supp*100)}%</b></div>
            <div class="dna-cell">🌀假动作: <b>${Math.round(d.feint*100)}%</b></div>
        `;

        document.getElementById('home-mini-ladder').innerHTML = this.list.slice(0, 3).map((item, i) => `
            <div class="mini-row">
                <span>${i===0?'🥇':(i===1?'🥈':'🥉')} <b>${item.aiName}</b> <small style="color:#9399b2;">by ${item.author}</small></span>
                <span style="color:#a6e3a1;font-weight:bold;">${item.fit}分</span>
            </div>
        `).join('');
    },

    async syncCloud(pushNow = false) {
        const dot = document.getElementById('net-dot');
        const mainUrl = 'https://api.npoint.io/55fa615e9b8474d58c5c';
        const readUrls = [
            mainUrl + '?t=' + Date.now(),
            'https://corsproxy.io/?' + encodeURIComponent(mainUrl),
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(mainUrl)
        ];

        let connected = false;
        let remoteCount = 0;

        // 1. 多线竞速读取：只要国内4G能连上任意一条线路，立刻成功返回！
        for (let url of readUrls) {
            try {
                const res = await fetchWithTimeout(url, { method: 'GET' }, 5500);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) {
                        remoteCount = data.length;
                        this.mergeIntoList(data);
                        connected = true;
                        break; // 读到最新云端数据后立即停止后续冗余请求
                    }
                }
            } catch (e) {}
        }

        this.sortAndApplyTopBoss();

        // 2. 如果需要上传数据，或者本地有比云端更新的AI，尝试多线路写入
        if (pushNow || (connected && this.list.length > remoteCount)) {
            const writeUrls = [
                mainUrl,
                'https://corsproxy.io/?' + encodeURIComponent(mainUrl)
            ];
            for (let wUrl of writeUrls) {
                try {
                    const wRes = await fetchWithTimeout(wUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.list)
                    }, 6000);
                    if (wRes.ok) { connected = true; break; }
                } catch (e) {}
            }
        }

        if (connected) {
            this.syncStatus = '🟢 全服云端天梯实时互通已连接';
            if (dot) dot.style.background = '#a6e3a1';
        } else {
            this.syncStatus = '🟡 极速离线/基因码互通模式';
            if (dot) dot.style.background = '#f9e2af';
        }
        this.sortAndApplyTopBoss();
    },

    async uploadMyAI(customBot) {
        const myFit = customBot ? customBot.fit : AI.bestScore;
        const myDNA = customBot ? customBot.dna : AI.champDNA;
        const author = prompt('🌍 登顶全服天梯榜！\n请输入你的培育师署名：', localStorage.getItem('TANK_AUTHOR') || '神秘炼蛊师');
        if (!author) return;
        localStorage.setItem('TANK_AUTHOR', author.slice(0, 12));

        const aiName = prompt('🤖 请为你的 16维 AI 命名：', customBot?.name || `👑战神G${AI.gen}`);
        if (!aiName) return;

        const entry = {
            id: 'p_' + Date.now(),
            aiName: aiName.slice(0, 14),
            author: author.slice(0, 12),
            gen: AI.gen,
            fit: Math.max(myFit, 150),
            dna: AI.fixDNA(myDNA)
        };

        this.mergeIntoList([entry]);
        this.sortAndApplyTopBoss();
        this.openModal(true);
        await this.syncCloud(true);
        if (this.list[0].aiName === entry.aiName) {
            alert(`🎉 恭喜！【${entry.aiName}】已登顶全服天梯第 1 名，正式接管主界面【全服守关大魔王】宝座！`);

    exportCode(idx) {
        const item = this.list[idx]; if (!item) return;
        const str = btoa(encodeURIComponent(JSON.stringify(item)));
        navigator.clipboard?.writeText(str);
        prompt('📋 复制下方【单个AI基因码】发到评论区或给好友挑战：', str);

    exportFullBackup() {
        const pack = {
            type: 'FULL_SYNC',
            gen: AI.gen,
            bestScore: AI.bestScore,
            champDNA: AI.champDNA,
            list: this.list
        };
        const str = btoa(encodeURIComponent(JSON.stringify(pack)));
        navigator.clipboard?.writeText(str);
        prompt('🔄【跨浏览器整榜迁移码】已生成！\n复制下方代码，去另一个浏览器点击“📥 导入代码”，即可把整个天梯榜和你的AI代数完整同步过去：', str);
    },

    importCode() {
        const str = prompt('📥 请粘贴【单个AI基因码】或【跨浏览器整榜迁移码】：');
        if (!str) return;
        try {
            const obj = JSON.parse(decodeURIComponent(atob(str.trim())));
            if (obj && obj.type === 'FULL_SYNC' && Array.isArray(obj.list)) {
                this.mergeIntoList(obj.list);
                if (obj.gen > AI.gen) AI.gen = obj.gen;
                if (obj.bestScore > AI.bestScore) { AI.bestScore = obj.bestScore; AI.champDNA = AI.fixDNA(obj.champDNA); }
                AI.save();
                this.sortAndApplyTopBoss();
                this.openModal(true);
                this.syncCloud(true);
                alert(`🎉 跨浏览器整榜迁移成功！已同步 ${obj.list.length} 个天梯AI及最高战力(${AI.bestScore}分)！`);
            } else if (obj && obj.dna) {
                this.mergeIntoList([obj]);
                this.sortAndApplyTopBoss();
                this.openModal(true);
                this.syncCloud(true);
                alert(`🎉 成功导入【${obj.author}】的【${obj.aiName}】(战力:${obj.fit})！`);

/**
 * ====================================================================
 * 3. 核心物理与渲染引擎 (Game)
 * ====================================================================
 */
const Game = {
    width: window.innerWidth, height: window.innerHeight, paused: false, inMenu: true,
    cfg: { tankR: 13, bulR: 4, bulSpd: 4.4, tankSpd: 3.1, fireCd: 500, maxBnc: 5 },
    arena: { topY: 84, botY: 500, ah: 416 }, mapIdx: 0,
    player: { x: 200, y: 300, bAng: -1.57, tAng: -1.57, dead: false, ammo: 3, maxAmmo: 3, lastRegen: 0, lastShot: 0, lvx: 0, lvy: 0 },
    bullets: [], walls: [], particles: [],
    inputs: { mx: 0, my: 0, fire: false, keys: {} },

    initMap() {
        this.width = document.documentElement.clientWidth || window.innerWidth;
        this.height = document.documentElement.clientHeight || window.innerHeight;
        canvas.width = this.width; canvas.height = this.height;
        const w = this.width, h = this.height, t = 12;
        const topY = this.inMenu ? 0 : 84, botY = this.inMenu ? h : h - 170, ah = botY - topY;
        this.arena = { topY, botY, w, ah };
        const cx = w * 0.5, cy = topY + ah * 0.5;
        const ws = [
            { x: 0, y: topY, w, h: t }, { x: 0, y: botY - t, w, h: t },
            { x: 0, y: topY, w: t, h: ah }, { x: w - t, y: topY, w: t, h: ah }
        ];
        const mt = this.mapIdx % 3;
        if (mt === 0) {
            ws.push(
                { x: cx - w*0.14, y: cy - 6, w: w*0.28, h: 12 }, { x: cx - 6, y: cy - ah*0.14, w: 12, h: ah*0.28 },
                { x: w*0.18, y: topY + ah*0.2, w: w*0.18, h: 12 }, { x: w*0.18, y: topY + ah*0.2, w: 12, h: ah*0.15 },
                { x: w*0.64, y: topY + ah*0.2, w: w*0.18, h: 12 }, { x: w*0.82 - 12, y: topY + ah*0.2, w: 12, h: ah*0.15 },
                { x: w*0.18, y: topY + ah*0.8 - 12, w: w*0.18, h: 12 }, { x: w*0.18, y: topY + ah*0.65, w: 12, h: ah*0.15 },
                { x: w*0.64, y: topY + ah*0.8 - 12, w: w*0.18, h: 12 }, { x: w*0.82 - 12, y: topY + ah*0.65, w: 12, h: ah*0.15 }
            );
        } else if (mt === 1) {
            ws.push(
                { x: w*0.25, y: topY + ah*0.22, w: w*0.5, h: 12 }, { x: w*0.18, y: cy - 6, w: w*0.24, h: 12 },
                { x: w*0.58, y: cy - 6, w: w*0.24, h: 12 }, { x: w*0.25, y: topY + ah*0.78 - 12, w: w*0.5, h: 12 }
            );
        } else {
            for (let r = 1; r <= 2; r++) for (let c = 1; c <= 2; c++) ws.push({ x: w*(c*0.33) - 18, y: topY + ah*(r*0.33) - 18, w: 36, h: 36 });
            ws.push({ x: cx - 6, y: cy - ah*0.12, w: 12, h: ah*0.24 });
        }
        this.walls = ws;
    },
    circleRect(cx, cy, cr, rx, ry, rw, rh) {
        const x = Math.max(rx, Math.min(cx, rx + rw)), y = Math.max(ry, Math.min(cy, ry + rh));
        return ((cx - x)**2 + (cy - y)**2) < cr*cr;
    },
    dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); },
    getSafeSpawn(topHalf = null) {
        const ar = this.arena, r = this.cfg.tankR + 8;
        for (let i = 0; i < 60; i++) {
            const x = 28 + Math.random() * (this.width - 56);
            let y = ar.topY + 24 + Math.random() * (ar.ah - 48);
            if (topHalf === true) y = ar.topY + 24 + Math.random() * (ar.ah * 0.25);
            if (topHalf === false) y = ar.botY - 24 - Math.random() * (ar.ah * 0.25);
            if (!this.walls.some(w => this.circleRect(x, y, r, w.x, w.y, w.w, w.h))) return { x, y };
        }
        return { x: this.width / 2, y: ar.botY - 35 };
    },
    spawnBullet(x, y, ang, owner, color) {
        const spd = this.cfg.bulSpd, r = this.cfg.bulR;
        let vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd, bx = x, by = y, bnc = 0;
        const step = (this.cfg.tankR + r + 4) / 6;
        for (let s = 0; s < 6; s++) {
            const svx = (vx/spd)*step, svy = (vy/spd)*step; let hit = false;
            bx += svx; if (this.walls.some(w => this.circleRect(bx,by,r,w.x,w.y,w.w,w.h))) { bx-=svx; vx=-vx; hit=true; }
            by += svy; if (this.walls.some(w => this.circleRect(bx,by,r,w.x,w.y,w.w,w.h))) { by-=svy; vy=-vy; hit=true; }
            if (hit) bnc++;
        }
        this.bullets.push({ x:bx, y:by, vx, vy, r, bnc, maxBnc:this.cfg.maxBnc, color, owner, steps:0 });
    },
    spawnExplosion(x, y, color) {
        if (AI.speed > 5) return;
        for (let i = 0; i < 14; i++) {
            const a = Math.random()*6.28, s = 1 + Math.random()*3.8;
            this.particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:2+Math.random()*3, alpha:1, color });
        }
    },
    shoot() {
        const p = this.player, now = Date.now();
        if (p.dead || AI.spectate || now - p.lastShot < this.cfg.fireCd || p.ammo <= 0) return;
        p.lastShot = now; p.ammo--;
        this.spawnBullet(p.x, p.y, p.tAng, 'player', '#89b4fa');
    },
    updatePlayer() {
        const p = this.player, now = Date.now();
        if (AI.spectate) { p.dead = true; p.x = -999; return; }
        if (p.ammo < p.maxAmmo && now - p.lastRegen > 1050) { p.ammo++; p.lastRegen = now; }
        if (p.dead) return;
        const r = this.cfg.tankR, k = this.inputs.keys;
        let vx = this.inputs.mx * this.cfg.tankSpd, vy = this.inputs.my * this.cfg.tankSpd;
        if (k['KeyW'] || k['ArrowUp']) vy = -this.cfg.tankSpd;
        if (k['KeyS'] || k['ArrowDown']) vy = this.cfg.tankSpd;
        if (k['KeyA'] || k['ArrowLeft']) vx = -this.cfg.tankSpd;
        if (k['KeyD'] || k['ArrowRight']) vx = this.cfg.tankSpd;
        p.lvx = vx; p.lvy = vy;
        if (Math.hypot(vx, vy) > 0.05) { p.bAng = Math.atan2(vy, vx); if (!TouchCtrl.aiming) p.tAng = p.bAng; }
        p.x += vx; if (this.walls.some(w => this.circleRect(p.x,p.y,r,w.x,w.y,w.w,w.h))) p.x -= vx;
        p.y += vy; if (this.walls.some(w => this.circleRect(p.x,p.y,r,w.x,w.y,w.w,w.h))) p.y -= vy;
        if (this.inputs.fire || k['Space']) this.shoot();
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i];
            if (((b.owner!=='player')||(b.bnc>0&&b.steps>8)||(b.steps>20)) && this.dist(p.x,p.y,b.x,b.y) < r+b.r) {
                this.bullets.splice(i, 1); this.spawnExplosion(p.x, p.y, '#89b4fa');
                p.dead = true; AI.onKill(b.owner, 'player'); break;
            }
        }
    },
    updateBullets() {
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            let b = this.bullets[i]; b.steps++; let bw = false;
            for (let s = 0; s < 2; s++) {
                b.x += b.vx*0.5; if (this.walls.some(w => this.circleRect(b.x,b.y,b.r,w.x,w.y,w.w,w.h))) { b.x-=b.vx*0.5; b.vx=-b.vx; bw=true; }
                b.y += b.vy*0.5; if (this.walls.some(w => this.circleRect(b.x,b.y,b.r,w.x,w.y,w.w,w.h))) { b.y-=b.vy*0.5; b.vy=-b.vy; bw=true; }
            }
            if (bw && ++b.bnc > b.maxBnc) this.bullets.splice(i, 1);
            else if (b.steps > 550) this.bullets.splice(i, 1);
        }
    },
    drawTank(x, y, bAng, tAng, col, lbl, crown) {
        const r = this.cfg.tankR, s = r / 22;
        ctx.save(); ctx.translate(x, y);
        ctx.save(); ctx.rotate(bAng);
        ctx.fillStyle = '#313244'; ctx.fillRect(-24*s,-24*s,48*s,10*s); ctx.fillRect(-24*s,14*s,48*s,10*s);
        ctx.fillStyle = col; ctx.fillRect(-20*s,-17*s,40*s,34*s); ctx.strokeStyle = '#11111b'; ctx.lineWidth = 1.8; ctx.strokeRect(-20*s,-17*s,40*s,34*s);
        ctx.restore();
        ctx.save(); ctx.rotate(tAng);
        ctx.fillStyle = '#cdd6f4'; ctx.fillRect(0,-4.5*s,32*s,9*s); ctx.strokeStyle = '#11111b'; ctx.lineWidth = 1.4; ctx.strokeRect(0,-4.5*s,32*s,9*s);
        ctx.beginPath(); ctx.arc(0,0,12*s,0,6.28); ctx.fillStyle = col; ctx.fill(); ctx.stroke();
        ctx.restore();
        if (lbl) {
            const cleanLbl = lbl.replace(/^👑\s*/, '');
            ctx.fillStyle = col; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText((crown ? '👑' : '') + cleanLbl, 0, -r - 6);
        }
        ctx.restore();
    },
    render() {
        const ar = this.arena;
        ctx.clearRect(0, 0, this.width, this.height);
        if (!this.inMenu) {
            ctx.fillStyle = '#11111b'; ctx.fillRect(0, ar.botY, this.width, this.height - ar.botY);
            ctx.strokeStyle = '#89b4fa'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, ar.botY); ctx.lineTo(this.width, ar.botY); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
        for (let x = 0; x < this.width; x += 36) { ctx.beginPath(); ctx.moveTo(x, ar.topY); ctx.lineTo(x, ar.botY); ctx.stroke(); }
        for (let y = ar.topY; y < ar.botY; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke(); }
        for (let w of this.walls) { ctx.fillStyle = '#585b70'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.strokeStyle='#11111b'; ctx.lineWidth=1.5; ctx.strokeRect(w.x,w.y,w.w,w.h); }
        for (let b of this.bullets) { ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.28); ctx.fillStyle=b.color; ctx.fill(); }
        const p = this.player;
        if (!p.dead && !AI.spectate) {
            this.drawTank(p.x, p.y, p.bAng, p.tAng, '#89b4fa', '你', false);
            for (let i = 0; i < p.maxAmmo; i++) { ctx.fillStyle = i < p.ammo ? '#89b4fa' : 'rgba(255,255,255,0.2)'; ctx.fillRect(p.x - 14 + i*10, p.y + 18, 8, 3.5); }
        }
        for (let b of AI.bots) if (!b.dead) {
            const showFit = AI.mode.startsWith('LAB');
            this.drawTank(b.x, b.y, b.bAng, b.tAng, b.color, showFit ? `${b.name}[${AI.calcFit(b)}]` : b.name, b.isElite);
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let pt = this.particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.alpha -= 0.04;
            if (pt.alpha <= 0) { this.particles.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = Math.max(0,pt.alpha); ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,6.28); ctx.fillStyle = pt.color; ctx.fill(); ctx.restore();
        }
        if (!this.inMenu) AI.renderFooter();
    }
};

/**
 * ====================================================================
 * 4. 16维高阶神经网络与遗传算法引擎 (AI)
 * ====================================================================
 */
const AI = {
    gen: 1, bestScore: 150, pWins: 0, aiWins: 0,
    champDNA: {}, pool: [], bots: [],
    mode: 'BG_DEMO', spectate: true, speed: 1, ticks: 0,
    koth: { king: 0, chal: 1, next: 2, mTicks: 0 },
    duelTarget: null, duelRankIdx: -1, duelScore: { a: 0, b: 0 },

    fixDNA(d = {}) {
        const res = {};
        for (let [k, , mn, mx, c] of DNA_SPEC) {
            const def = mn + Math.random() * (mx - mn);
            res[k] = d[k] !== undefined ? +Math.max(mn, Math.min(mx, Number(d[k]))).toFixed(c) : +def.toFixed(c);
        }
        return res;
    },
    init() {
        try {
            const adm = JSON.parse(localStorage.getItem('TANK_ADM_V2'));
            if (adm) {
                Object.assign(window.SERVER_CONFIG, adm);
                if (window.SERVER_CONFIG.cloudApiUrl.includes('kvdb.io')) {
                    window.SERVER_CONFIG.cloudApiUrl = 'https://api.npoint.io/55fa615e9b8474d58c5c';
                }
            }
        } catch(e){}
        Admin.apply();

        let sv = null;
        try { sv = JSON.parse(localStorage.getItem(SAVE_KEY)) || JSON.parse(localStorage.getItem('TANK_CLOUD_ARENA_SAVE_V1')); } catch(e){}
        if (sv) {
            this.gen = sv.gen || 1; this.bestScore = sv.bestScore || 150;
            this.pWins = sv.pWins || 0; this.aiWins = sv.aiWins || 0;
            this.champDNA = this.fixDNA(sv.champDNA);
            this.pool = (sv.pool && sv.pool.length === 6) ? sv.pool.map(d => this.fixDNA(d)) : [];
        }
        if (!this.pool.length) {
            this.champDNA = this.fixDNA(DEFAULT_LADDER[0].dna);
            this.pool = Array.from({ length: 6 }, () => this.fixDNA());
        }
        Cloud.init();
        this.updateHomeNumbers();
    },
    save() {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
            gen: this.gen, bestScore: this.bestScore, pWins: this.pWins, aiWins: this.aiWins,
            champDNA: this.champDNA, pool: this.pool
        }));
        this.updateHomeNumbers();
    },
    updateHomeNumbers() {
        document.getElementById('rec-p').innerText = this.pWins;
        document.getElementById('rec-ai').innerText = this.aiWins;
        document.getElementById('rec-gen').innerText = 'G' + this.gen;
        document.getElementById('rec-fit').innerText = this.bestScore;
    },
    calcFit(b) { return Math.round(b.kills*180 + (b.streak||0)*110 + Math.floor(b.dodged)*18 + (b.ticks/60)*5 - b.suicides*130); },

    spawnLabGen() {
        const COLS = ['#f38ba8','#fab387','#f9e2af','#a6e3a1','#89dceb','#cba6f7'];
        this.bots = []; this.ticks = 0; Game.bullets = [];
        for (let i = 0; i < 6; i++) {
            const sp = Game.getSafeSpawn(null);
            this.bots.push({
                id:'ai_'+i, idx:i, name:'#'+(i+1), color:COLS[i], isElite:i===0 && this.gen>1,
                dna:this.fixDNA(this.pool[i]), x:sp.x, y:sp.y, bAng:0, tAng:0, lvx:0, lvy:0,
                dead: this.mode === 'LAB_KOTH' ? (i > 1) : false,
                ammo:3, ammoT:0, cd:25, kills:0, streak:0, suicides:0, dodged:0, ticks:0, dir:i%2?1:-1
            });
        }
        if (this.mode === 'LAB_KOTH') {
            this.koth = { king: 0, chal: 1, next: 2, mTicks: 0 };
            const s1 = Game.getSafeSpawn(true), s2 = Game.getSafeSpawn(false);
            this.bots[0].x = s1.x; this.bots[0].y = s1.y; this.bots[1].x = s2.x; this.bots[1].y = s2.y;
        }
        if (this.mode === 'LAB_JOIN') {
            const spP = Game.getSafeSpawn(false), p = Game.player;
            p.dead = false; p.x = spP.x; p.y = spP.y; p.ammo = p.maxAmmo;
        }
        App.updateTopBar();
    },
    nextBout(winIdx) {
        Game.bullets = [];
        if (this.koth.next >= 6) { this.evolve(); return; }
        this.koth.king = winIdx; this.koth.chal = this.koth.next++; this.koth.mTicks = 0;
        const k = this.bots[this.koth.king], c = this.bots[this.koth.chal];
        k.dead = false; k.ammo = 3; k.cd = 22; c.dead = false; c.ammo = 3; c.cd = 22;
        const s1 = Game.getSafeSpawn(true), s2 = Game.getSafeSpawn(false);
        k.x = s1.x; k.y = s1.y; c.x = s2.x; c.y = s2.y;
        App.updateTopBar();
    },
    evolve() {
        this.bots.forEach(b => b.fit = this.calcFit(b));
        this.bots.sort((a,b) => b.fit - a.fit);
        const a = this.bots[0], b = this.bots[1];
        if (a.fit > this.bestScore) { this.bestScore = a.fit; this.champDNA = { ...a.dna }; }
        const cross = (d1,d2) => { const r={}; for(let [k] of DNA_SPEC) r[k]=Math.random()<.5?d1[k]:d2[k]; return r; };
        const mut = (d, rate) => {
            const res = {};
            for (let [k, , mn, mx, c] of DNA_SPEC) {
                const span = (mx - mn) * 0.14 * rate;
                res[k] = +Math.max(mn, Math.min(mx, d[k] + (Math.random()*2 - 1)*span)).toFixed(c);
            }
            return res;
        };
        this.pool = [{...a.dna}, {...this.champDNA}, mut(cross(a.dna,b.dna),0.6), mut(cross(a.dna,this.champDNA),0.9), mut(cross(b.dna,this.bots[2].dna),1.2), mut(a.dna,1.8)];
        this.gen++; this.save(); this.spawnLabGen();
    },

    simShot(bot, ang, allowSupp = false) {
        const spd = Game.cfg.bulSpd * 1.6, ws = Game.walls, hr = Game.cfg.tankR + 5;
        let bx = bot.x+Math.cos(ang)*(hr+2), by = bot.y+Math.sin(ang)*(hr+2), vx = Math.cos(ang)*spd, vy = Math.sin(ang)*spd, bnc = 0;
        if (ws.some(w => Game.circleRect(bx,by,4,w.x,w.y,w.w,w.h))) return -1;
        for (let s = 0; s < 68; s++) {
            bx += vx; if (ws.some(w => Game.circleRect(bx,by,4,w.x,w.y,w.w,w.h))) { bx-=vx; vx=-vx; bnc++; }
            by += vy; if (ws.some(w => Game.circleRect(bx,by,4,w.x,w.y,w.w,w.h))) { by-=vy; vy=-vy; bnc++; }
            if (bnc > Game.cfg.maxBnc) break;
            if ((bnc>0||s>5) && Game.dist(bx,by,bot.x,bot.y) < hr+12) return -1;
            for (let o of this.bots) if (!o.dead && o.id!==bot.id) {
                const d = Game.dist(bx,by,o.x,o.y);
                if (d < hr) return 2;
                if (allowSupp && bnc > 0 && d < hr * 2.6) return 1;
            }
            const p = Game.player;
            if (!p.dead && !this.spectate) {
                const dp = Game.dist(bx,by,p.x,p.y);
                if (dp < hr) return 2;
                if (allowSupp && bnc > 0 && dp < hr * 2.6) return 1;
            }
        }
        return 0;
    },

    step() {
        this.ticks++;
        const r = Game.cfg.tankR, alive = this.bots.filter(b=>!b.dead);
        const p = Game.player, pAct = !p.dead && !this.spectate;

        if (this.mode === 'LAB_KOTH') {
            if (++this.koth.mTicks > 720 && alive.length >= 2) {
                const ar = Game.arena, cx = Game.width/2, cy = ar.topY + ar.ah/2;
                const d0 = Game.dist(alive[0].x,alive[0].y,cx,cy), d1 = Game.dist(alive[1].x,alive[1].y,cx,cy);
                const loser = d0 > d1 ? alive[0] : alive[1], winner = d0 > d1 ? alive[1] : alive[0];
                loser.dead = true; winner.streak++; this.nextBout(winner.idx); return;
            }
        } else if ((this.mode === 'LAB_FFA' || this.mode === 'LAB_JOIN') && ((!pAct && alive.length <= 1) || (pAct && alive.length === 0) || this.ticks > 1200)) {
            this.evolve(); return;
        } else if (this.mode === 'BG_DEMO' && (alive.length <= 1 || this.ticks > 900)) {
            this.spawnLabGen(); return;
        }

        for (let bot of alive) {
            bot.ticks++; if (++bot.ammoT > 58 && bot.ammo < 3) { bot.ammo++; bot.ammoT = 0; }
            if (bot.cd > 0) bot.cd--;
            let tgt = null, minD = 9999;
            for (let o of alive) if (o.id !== bot.id) { const d = Game.dist(bot.x,bot.y,o.x,o.y); if (d < minD) { minD = d; tgt = o; } }
            if (pAct) { const dp = Game.dist(bot.x,bot.y,p.x,p.y); if (dp < minD) { minD = dp; tgt = p; } }

            let mx = 0, my = 0, nearWalls = 0, danger = false;
            for (let b of Game.bullets) {
                const dx = bot.x - b.x, dy = bot.y - b.y, d = Math.hypot(dx, dy);
                if (d < 195) {
                    const bs = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / bs, uy = b.vy / bs, proj = dx*ux + dy*uy;
                    if (proj > -12 && proj < 170 && Math.abs(dx*(-uy) + dy*ux) < r + 24 + bot.dna.matrix*1.5) {
                        danger = true;
                        const side = (dx*(-uy) + dy*ux) >= 0 ? 1 : -1, bW = b.bnc > 0 ? bot.dna.bncW : 1;
                        const f = ((195 - d)/195) * bot.dna.dodge * bW * 4.2;
                        mx += (-uy)*side*f; my += ux*side*f; if (d < 45) bot.dodged += 0.1;
                    }
                }
            }
            for (let w of Game.walls) {
                const cx = Math.max(w.x,Math.min(bot.x,w.x+w.w)), cy = Math.max(w.y,Math.min(bot.y,w.y+w.h)), dw = Game.dist(bot.x,bot.y,cx,cy);
                if (dw < r + 24 && dw > 0.1) {
                    nearWalls++;
                    const rp = ((r + 24 - dw)/24) * bot.dna.wall * (bot.ammo === 0 ? bot.dna.peek : 1.5);
                    mx += ((bot.x - cx)/dw)*rp; my += ((bot.y - cy)/dw)*rp;
                }
            }
            if (nearWalls >= 2) {
                const ar = Game.arena, angC = Math.atan2((ar.topY+ar.ah/2)-bot.y, (Game.width/2)-bot.x);
                mx += Math.cos(angC)*bot.dna.cor*2.2; my += Math.sin(angC)*bot.dna.cor*2.2;
            }
            if (tgt) {
                const a = Math.atan2(tgt.y - bot.y, tgt.x - bot.x);
                if (Math.random() < bot.dna.freq || (danger && Math.random() < bot.dna.feint * 0.15)) bot.dir *= -1;
                if (minD > bot.dna.dist + 30) { mx += Math.cos(a)*0.8; my += Math.sin(a)*0.8; }
                else if (minD < bot.dna.dist - 25) { mx -= Math.cos(a)*0.9; my -= Math.sin(a)*0.9; }
                mx += Math.cos(a + 1.57*bot.dir)*0.8; my += Math.sin(a + 1.57*bot.dir)*0.8;
            }
            const mag = Math.hypot(mx, my);
            if (mag > 0.05) {
                const boost = (danger || bot.ammo === 1) ? Math.min(1.08, 0.85 + bot.dna.rage * 0.1) : 0.9;
                const s = Game.cfg.tankSpd * boost, vx = (mx/mag)*s, vy = (my/mag)*s;
                bot.bAng = Math.atan2(vy, vx); bot.lvx = vx; bot.lvy = vy;
                bot.x += vx; if (Game.walls.some(w => Game.circleRect(bot.x,bot.y,r,w.x,w.y,w.w,w.h))) { bot.x -= vx; bot.dir *= -1; }
                bot.y += vy; if (Game.walls.some(w => Game.circleRect(bot.x,bot.y,r,w.x,w.y,w.w,w.h))) { bot.y -= vy; bot.dir *= -1; }
            }
            if (tgt && bot.ammo > 0 && bot.cd <= 0) {
                const holdLastAmmo = (bot.ammo === 1 && minD > 115 && Math.random() < bot.dna.consv * 0.65);
                if (!holdLastAmmo) {
                    const ft = minD / Game.cfg.bulSpd;
                    const da = Math.atan2((tgt.y + (tgt.lvy||0)*ft*bot.dna.lead) - bot.y, (tgt.x + (tgt.lvx||0)*ft*bot.dna.lead) - bot.x);
                    let fa = null;
                    if (Math.random() > bot.dna.amb && this.simShot(bot, da) === 2) fa = da;
                    if (fa === null) {
                        const allowSupp = bot.ammo >= 2 && Math.random() < bot.dna.supp;
                        for (let k = 0; k < bot.dna.iq; k++) {
                            const ta = Math.random()*6.28 - 3.14;
                            if (this.simShot(bot, ta, allowSupp) > 0) { fa = ta; break; }
                        }
                    }
                    if (fa === null && this.simShot(bot, da) === 2) fa = da;
                    if (fa !== null) {
                        bot.tAng = fa; bot.ammo--; bot.cd = Math.round(26 * bot.dna.pat);
                        Game.spawnBullet(bot.x, bot.y, fa, bot.id, bot.color);
                    } else bot.tAng = da;
                }
            }
            for (let i = Game.bullets.length - 1; i >= 0; i--) {
                let b = Game.bullets[i];
                if (((b.owner!==bot.id)||(b.bnc>0&&b.steps>8)||(b.steps>20)) && Game.dist(bot.x,bot.y,b.x,b.y) < r+b.r) {
                    Game.bullets.splice(i,1); Game.spawnExplosion(bot.x,bot.y,bot.color);
                    bot.dead = true; this.onKill(b.owner, bot.id); break;
                }
            }
        }
    },

    onKill(kId, vId) {
        if (this.mode === 'DUEL') {
            if (vId === 'player') this.aiWins++; else this.pWins++;
            this.save(); App.updateTopBar();
            setTimeout(() => { if (!Game.inMenu && this.mode === 'DUEL') App.spawnDuelRound(); }, 900);
            return;
        }
        if (this.mode === 'AI_VS_AI') {
            if (vId === 'ai_my') this.duelScore.b++; else this.duelScore.a++;
            App.updateTopBar();
            if (this.duelScore.a >= 2 || this.duelScore.b >= 2) {
                const win = this.duelScore.a >= 2;
                setTimeout(() => {
                    if (win) {
                        const prizeFit = Math.max(this.bestScore, this.duelTarget.fit + 60);
                        this.bestScore = prizeFit; this.save();
                        alert(`🏆 抢榜成功！你的 G${this.gen} 冠军AI 以 ${this.duelScore.a}:${this.duelScore.b} 击败了【${this.duelTarget.aiName}】！\n战力飙升至 ${prizeFit} 分！现在可一键登顶全服天梯！`);
                        Cloud.uploadMyAI({ name: `👑弑神者G${this.gen}`, fit: prizeFit, dna: this.champDNA });
                    } else {
                        alert(`💔 惜败！你的AI以 ${this.duelScore.a}:${this.duelScore.b} 不敌【${this.duelTarget.aiName}】，快去实验室开启300倍速继续进化吧！`);
                        this.duelScore = { a: 0, b: 0 }; App.spawnAIvsAIRound();
                    }
                }, 400);
            } else {
                setTimeout(() => { if (!Game.inMenu && this.mode === 'AI_VS_AI') App.spawnAIvsAIRound(); }, 900);
            }
            return;
        }
        if (this.mode === 'LAB_JOIN' && vId === 'player') {
            setTimeout(() => {
                if (this.mode === 'LAB_JOIN') {
                    const sp = Game.getSafeSpawn(false);
                    Game.player.dead = false; Game.player.x = sp.x; Game.player.y = sp.y; Game.player.ammo = Game.player.maxAmmo;
                }
            }, 1300);
            return;
        }
        const k = this.bots.find(b => b.id===kId), v = this.bots.find(b => b.id===vId);
        if (k && kId!==vId) { k.kills++; k.streak = (k.streak||0) + 1; }
        if (v && kId===vId) v.suicides++;
        if (this.mode === 'LAB_KOTH' && v) {
            this.nextBout((v.idx === this.koth.king) ? this.koth.chal : this.koth.king);
        }
    },

    renderFooter() {
        const ar = Game.arena;
        ctx.fillStyle = '#cdd6f4'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        if (this.mode === 'LAB_KOTH') {
            const k = this.bots[this.koth.king] || {}, c = this.bots[this.koth.chal] || {};
            ctx.fillText(`🏆 G${this.gen} 16维擂台 (${this.koth.next-1}/5场) | 👑擂主:${k.name}(${k.streak||0}连胜) VS ⚔️挑战者:${c.name}`, Game.width/2, ar.botY + 24);
        } else if (this.mode === 'LAB_FFA') {
            ctx.fillText(`🏟️ G${this.gen} 6人混战炼蛊 | 你的最强AI战力: ${this.bestScore}分 (可去天梯抢榜夺冠)`, Game.width/2, ar.botY + 24);
        } else if (this.mode === 'AI_VS_AI') {
            ctx.fillText(`🏆 天梯抢榜生死战(3局2胜)：你的G${this.gen}冠军 [${this.duelScore.a} : ${this.duelScore.b}] ${this.duelTarget.aiName}`, Game.width/2, ar.botY + 24);
        } else {
            ctx.fillText(`🎮 左下摇杆走位 | 右侧按钮或点击屏幕任意位置精确瞄准射击`, Game.width/2, ar.botY + 22);
        }
    }
};

const Admin = {
    clicks: 0, lastT: 0,
    clickLogo() {
        const now = Date.now(); if (now - this.lastT > 1500) this.clicks = 0;
        this.lastT = now;
        if (++this.clicks >= 5) {
            this.clicks = 0;
            if (prompt('🔒 请输入站长授权码：') === window.SERVER_CONFIG.adminPin) {
                const c = window.SERVER_CONFIG;
                document.getElementById('adm-notice').value = c.noticeText;
                document.getElementById('adm-pin').value = c.adminPin;
                document.getElementById('adm-api').value = c.cloudApiUrl;
                document.getElementById('adm-tspd').value = c.tankSpeed;
                document.getElementById('adm-bspd').value = c.bulletSpeed;
                document.getElementById('adm-bnc').value = c.maxBounces;
                document.getElementById('adm-ammo').value = c.maxAmmo;
                document.getElementById('admin-modal').style.display = 'flex';

    apply() {
        const c = window.SERVER_CONFIG;
        document.getElementById('notice-bar').innerText = c.noticeText;
        Game.cfg.tankSpd = Number(c.tankSpeed) || 3.1;
        Game.cfg.bulSpd = Number(c.bulletSpeed) || 4.4;
        Game.cfg.maxBnc = Number(c.maxBounces) || 5;
        Game.player.maxAmmo = Number(c.maxAmmo) || 3;
    },
    save() {
        const c = window.SERVER_CONFIG;
        c.noticeText = document.getElementById('adm-notice').value.trim();
        c.adminPin = document.getElementById('adm-pin').value.trim() || '8888';
        c.cloudApiUrl = document.getElementById('adm-api').value.trim() || c.cloudApiUrl;
        c.tankSpeed = parseFloat(document.getElementById('adm-tspd').value);
        c.bulletSpeed = parseFloat(document.getElementById('adm-bspd').value);
        c.maxBounces = parseInt(document.getElementById('adm-bnc').value);
        c.maxAmmo = parseInt(document.getElementById('adm-ammo').value);
        localStorage.setItem('TANK_ADM_V2', JSON.stringify(c));
        this.apply();
        document.getElementById('admin-modal').style.display = 'none';
        alert('✅ 配置已保存并实时生效！');
    },
    exportHTML() {
        this.save();
        let html = document.documentElement.outerHTML;
        const script = `\n<script>window.SERVER_CONFIG=${JSON.stringify(window.SERVER_CONFIG)};<\/script>\n`;
        html = html.replace('<head>', '<head>' + script);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + html], { type: 'text/html;charset=utf-8' }));
        a.download = 'index.html'; a.click();
    }
};

/**
 * ====================================================================
 * 6. 触屏双摇杆与【恒定60FPS物理步长锁】主循环
 * ====================================================================
 */
const TouchCtrl = {
    joyId: null, aimId: null, aiming: false, center: { x: 0, y: 0 }, maxR: 46,
    init() {
        const zone = document.getElementById('joystick-zone'), knob = document.getElementById('joystick-knob'), fire = document.getElementById('fire-btn');
        zone.addEventListener('touchstart', e => {
            e.preventDefault(); const t = e.changedTouches[0]; this.joyId = t.identifier;
            const r = zone.getBoundingClientRect(); this.center = { x: r.left + r.width/2, y: r.top + r.height/2 };
            this.move(t.clientX, t.clientY, knob);
        }, { passive: false });
        zone.addEventListener('touchmove', e => {
            e.preventDefault();
            for (let t of e.changedTouches) if (t.identifier === this.joyId) this.move(t.clientX, t.clientY, knob);
        }, { passive: false });
        const endJoy = e => {
            for (let t of e.changedTouches) if (t.identifier === this.joyId) {
                this.joyId = null; Game.inputs.mx = 0; Game.inputs.my = 0; knob.style.transform = `translate(0px,0px)`;
            }
        };
        zone.addEventListener('touchend', endJoy); zone.addEventListener('touchcancel', endJoy);
        fire.addEventListener('touchstart', e => { e.preventDefault(); Game.inputs.fire = true; Game.shoot(); }, { passive: false });
        fire.addEventListener('touchend', e => { e.preventDefault(); Game.inputs.fire = false; });

        canvas.addEventListener('touchstart', e => {
            if (Game.inMenu || AI.spectate) return;
            e.preventDefault(); const t = e.changedTouches[0]; this.aimId = t.identifier; this.aiming = true;
            Game.player.tAng = Math.atan2(t.clientY - Game.player.y, t.clientX - Game.player.x);
            Game.inputs.fire = true; Game.shoot();
        }, { passive: false });
        canvas.addEventListener('touchmove', e => {
            if (Game.inMenu || AI.spectate) return;
            e.preventDefault();
            for (let t of e.changedTouches) if (t.identifier === this.aimId) Game.player.tAng = Math.atan2(t.clientY - Game.player.y, t.clientX - Game.player.x);
        }, { passive: false });
        canvas.addEventListener('touchend', e => {
            for (let t of e.changedTouches) if (t.identifier === this.aimId) { this.aimId = null; this.aiming = false; Game.inputs.fire = false; }
        });

        window.addEventListener('keydown', e => Game.inputs.keys[e.code] = true);
        window.addEventListener('keyup', e => Game.inputs.keys[e.code] = false);
        canvas.addEventListener('mousemove', e => {
            if (!Game.inMenu && !AI.spectate) { this.aiming = true; Game.player.tAng = Math.atan2(e.clientY - Game.player.y, e.clientX - Game.player.x); }
        });
        canvas.addEventListener('mousedown', () => { if (!Game.inMenu) Game.inputs.fire = true; });
        window.addEventListener('mouseup', () => Game.inputs.fire = false);
    },
    move(cx, cy, knob) {
        let dx = cx - this.center.x, dy = cy - this.center.y;
        const d = Math.hypot(dx, dy);
        if (d > this.maxR) { dx = (dx/d)*this.maxR; dy = (dy/d)*this.maxR; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        Game.inputs.mx = dx / this.maxR; Game.inputs.my = dy / this.maxR;
    }
};

let lastFrameTime = performance.now();
let timeAccumulator = 0;
const STEP_MS = 1000 / 60;

function loop(now) {
    if (!now) now = performance.now();
    let dt = now - lastFrameTime;
    lastFrameTime = now;
    if (dt > 100) dt = 100;

    if (!Game.paused) {
        if (AI.speed === 1) {
            timeAccumulator += dt;
            while (timeAccumulator >= STEP_MS) {
                Game.updatePlayer();
                Game.updateBullets();
                AI.step();
                timeAccumulator -= STEP_MS;
            }
        } else {
            timeAccumulator = 0;
            const t0 = performance.now();
            for (let s = 0; s < AI.speed; s++) {
                Game.updatePlayer();
                Game.updateBullets();
                AI.step();
                if (performance.now() - t0 > 14) break;
            }
        }
        Game.render();
    }
    requestAnimationFrame(loop);
}

window.addEventListener('resize', () => Game.initMap());
AI.init();
TouchCtrl.init();
App.goHome();
requestAnimationFrame(loop);
</script>
